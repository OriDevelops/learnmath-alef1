<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בית הספר למתמטיקה</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:"Heebo","Segoe UI",sans-serif;background:linear-gradient(135deg,#eef2ff 0%,#fdf2f8 50%,#ecfeff 100%);color:#0f172a;min-height:100vh}
  /* Fix KaTeX/math direction inside RTL document */
  .katex, .katex-display, .katex-html, span.katex {
    direction: ltr !important;
    unicode-bidi: isolate !important;
    text-align: left;
  }
  .katex-display { display: block; margin: 0.5em 0; text-align: center !important; }
  .wrap{max-width:1200px;margin:0 auto;padding:32px 24px}
  .hello{text-align:center;padding:40px 20px 20px}
  .hello h1{font-size:54px;font-weight:800;margin:0;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
  .hello p{margin:8px 0 0;color:#64748b;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .tile{background:white;border-radius:18px;padding:24px;border:2px solid #e2e8f0;cursor:pointer;transition:all .25s;text-align:right;display:flex;flex-direction:column;gap:6px}
  .tile:hover{border-color:#8b5cf6;transform:translateY(-4px);box-shadow:0 16px 40px rgba(139,92,246,.18)}
  .tile .emoji{font-size:36px;margin-bottom:6px}
  .tile h3{margin:0;font-size:18px;font-weight:700;color:#1e293b}
  .tile p{margin:0;font-size:14px;color:#64748b;line-height:1.5}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .topbar h2{margin:0;font-size:30px;font-weight:800;color:#0f172a;flex:1}
  .back{background:white;border:2px solid #e2e8f0;color:#475569;padding:10px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit;transition:all .2s}
  .back:hover{border-color:#8b5cf6;color:#8b5cf6}
  .card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 24px rgba(15,23,42,.06);border:1px solid #e2e8f0;margin-bottom:20px}
  .lesson{background:linear-gradient(135deg,#f0f9ff,#fdf4ff);border-right:4px solid #6366f1;padding:18px 22px;border-radius:14px;margin:14px 0}
  .lesson p{margin:8px 0;line-height:1.85;color:#334155}
  .lesson ul, .lesson ol{margin:8px 0;padding-right:24px;line-height:2}
  .lesson li{color:#334155}
  .formula{background:#fefce8;border:1px dashed #facc15;padding:14px 18px;border-radius:12px;margin:12px 0;text-align:center;font-size:18px}
  .example{background:#f0fdf4;border:1px solid #86efac;border-radius:14px;padding:18px 22px;margin:16px 0}
  .example h4{margin:0 0 10px;color:#166534;font-size:17px}
  .example .step{background:white;border-right:3px solid #10b981;padding:8px 14px;border-radius:8px;margin:6px 0;line-height:1.7}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{padding:13px 24px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s, box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
  .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:white}
  .btn-warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:white}
  .btn-secondary{background:#e2e8f0;color:#1e293b}
  .btn-pink{background:linear-gradient(135deg,#ec4899,#db2777);color:white}
  .qbox{background:linear-gradient(135deg,#fefce8,#fef3c7);border-radius:16px;padding:24px;border:2px solid #fde68a;margin:18px 0}
  .qhead{font-size:14px;font-weight:700;color:#92400e;letter-spacing:.5px}
  .qtext{font-size:18px;color:#451a03;margin-top:10px;line-height:1.8}
  .multi-q{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin-top:16px}
  .multi-q label{font-weight:600;color:#334155;font-size:15px}
  .multi-q input{padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;direction:ltr;text-align:right;font-family:inherit;background:white}
  .multi-q input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
  .feedback{margin-top:14px;padding:14px 18px;border-radius:12px;font-weight:600;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
  .feedback.bad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
  .feedback.partial{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .reveal{margin-top:14px;background:#f8fafc;border-radius:12px;padding:18px;border:1px solid #e2e8f0;display:none}
  .reveal.show{display:block}
  .reveal h4{margin:0 0 10px;color:#1e40af}
  .step{padding:10px 14px;background:white;border-radius:10px;margin:6px 0;border-right:3px solid #06b6d4;line-height:1.7}
  svg.parabola{background:#f8fafc;border-radius:10px;width:100%;max-width:400px;height:auto;display:block;margin:10px auto}
  .stepcard{background:white;border-radius:14px;padding:16px 20px;margin:12px 0;border:2px solid #e2e8f0;display:flex;gap:14px;align-items:flex-start}
  .stepcard.locked{opacity:.55;filter:grayscale(.4)}
  .stepcard.passed{border-color:#86efac;background:#f0fdf4}
  .stepcard.failed{border-color:#fca5a5;background:#fef2f2}
  .stepnum{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .stepcard.passed .stepnum{background:linear-gradient(135deg,#10b981,#059669)}
  .stepcard.failed .stepnum{background:linear-gradient(135deg,#ef4444,#dc2626)}
  .stepbody{flex:1;min-width:0}
  .stepbody h4{margin:0 0 4px;font-size:16px;color:#1e293b}
  .stephelp{font-size:14px;color:#64748b;margin:4px 0 10px;line-height:1.6}
  .stepinputs{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
  .stepinputs label{font-weight:600;color:#334155;font-size:14px}
  .stepinputs input{padding:9px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;direction:ltr;text-align:right;font-family:inherit;background:white}
  .stepinputs input:focus{outline:none;border-color:#6366f1}
  .stepactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .stepactions .btn{padding:8px 14px;font-size:13px}
  .stepfb{margin-top:8px;font-size:14px;font-weight:600;display:none}
  .stepfb.show{display:block}
  .stepfb.ok{color:#166534}
  .stepfb.bad{color:#991b1b}
  .stephint{margin-top:8px;padding:10px 12px;background:#fef3c7;border-radius:8px;font-size:14px;color:#78350f;line-height:1.6;display:none}
  .stephint.show{display:block}
  /* Device picker modal */
  .device-modal{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(10px)}
  .device-modal.hidden{display:none}
  .device-modal-content{background:white;border-radius:26px;padding:36px 30px;max-width:520px;width:90%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .device-modal-content h2{margin:0 0 8px;font-size:26px;color:#0f172a;font-weight:800}
  .device-modal-content p{margin:0 0 24px;color:#64748b}
  .device-options{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .device-btn{padding:28px 18px;border:3px solid #e2e8f0;border-radius:20px;background:white;cursor:pointer;font-size:17px;font-weight:700;color:#1e293b;font-family:inherit;transition:all .2s}
  .device-btn:hover{border-color:#6366f1;transform:translateY(-3px);box-shadow:0 12px 30px rgba(99,102,241,.2);background:#f5f3ff}
  .device-btn .ic{font-size:54px;display:block;margin-bottom:10px}
  .switch-mode{display:inline-flex;align-items:center;gap:6px;background:white;border:2px solid #e2e8f0;color:#475569;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .2s;margin-top:14px}
  .switch-mode:hover{border-color:#6366f1;color:#6366f1}
  /* Mobile mode overrides */
  body.mode-mobile .wrap{padding:14px 10px}
  body.mode-mobile .hello{padding:24px 12px 16px}
  body.mode-mobile .hello h1{font-size:42px}
  body.mode-mobile .grid{grid-template-columns:1fr !important;gap:12px}
  body.mode-mobile .tile{padding:18px}
  body.mode-mobile .tile h3{font-size:17px}
  body.mode-mobile .card{padding:16px}
  body.mode-mobile .topbar h2{font-size:22px}
  body.mode-mobile .topbar{flex-direction:row;flex-wrap:wrap}
  body.mode-mobile .qtext{font-size:15px}
  body.mode-mobile .multi-q{grid-template-columns:1fr;gap:6px 0}
  body.mode-mobile .multi-q label{margin-top:6px}
  body.mode-mobile .stepinputs{grid-template-columns:1fr;gap:6px}
  body.mode-mobile .stepinputs label{margin-top:6px}
  body.mode-mobile .actions{flex-direction:column;gap:8px}
  body.mode-mobile .actions .btn{width:100%}
  body.mode-mobile .lesson p, body.mode-mobile .lesson li{font-size:15px}
  body.mode-mobile .formula{font-size:15px;padding:10px;line-height:1.7}
  body.mode-mobile h3{font-size:17px}
  body.mode-mobile svg.parabola{max-width:100%}
  body.mode-mobile .stepcard{padding:12px 14px;gap:10px;flex-direction:column}
  body.mode-mobile .stepnum{width:34px;height:34px;font-size:14px}
  body.mode-mobile .stepactions .btn{padding:8px 12px;font-size:13px}
  body.mode-mobile .step{font-size:14px;padding:8px 12px}
  body.mode-mobile .qbox{padding:16px}
  body.mode-mobile .device-options{grid-template-columns:1fr 1fr}
  /* Desktop mode forcing */
  body.mode-desktop .grid{grid-template-columns:repeat(3,1fr)}
  .pill{display:inline-block;background:linear-gradient(135deg,#dbeafe,#ede9fe);color:#4338ca;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:10px}
  .hidden{display:none}
  /* Geometry diagram styles */
  .geom-svg{background:#fafbfc;border-radius:14px;width:100%;max-width:520px;height:auto;display:block;margin:0 auto;border:1px solid #e2e8f0}
  .diagram-container{margin:14px 0}
  .facts-container{background:#f8fafc;border-radius:14px;padding:16px 18px;margin:14px 0;border:1px solid #e2e8f0}
  .facts-container h4{margin:0 0 10px;font-size:15px;color:#475569;font-weight:700}
  .fact-list{display:flex;flex-direction:column;gap:8px}
  .fact-btn{text-align:right;background:white;border:2px solid #e2e8f0;color:#1e293b;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:10px}
  .fact-btn::before{content:'○';font-size:20px;color:#cbd5e1;transition:all .15s}
  .fact-btn:hover{border-color:#a78bfa;background:#faf5ff}
  .fact-btn.discovered{border-color:#10b981;background:#dcfce7;color:#14532d}
  .fact-btn.discovered::before{content:'●';color:#10b981}
  .proof-steps{background:linear-gradient(135deg,#fefce8,#fef9c3);border-radius:14px;padding:16px 18px;margin:14px 0;border:1px solid #fde68a}
  .proof-steps h4{margin:0 0 10px;font-size:15px;color:#854d0e;font-weight:700}
  .step-rows{display:flex;flex-direction:column;gap:8px}
  .step-row{display:flex;gap:10px;align-items:flex-start}
  .step-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fef3c7;color:#854d0e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:4px}
  .step-row textarea{flex:1;padding:8px 12px;border:2px solid #fde68a;border-radius:10px;font-size:14px;font-family:inherit;background:white;resize:vertical;min-height:36px;line-height:1.5}
  .step-row textarea:focus{outline:none;border-color:#f59e0b}
  .step-remove{background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:18px;padding:4px 8px;font-family:inherit}
  .step-remove:hover{color:#ef4444}
  .add-step-btn{margin-top:10px;background:white;border:2px dashed #fde68a;color:#854d0e;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:all .15s}
  .add-step-btn:hover{border-color:#f59e0b;background:#fef9c3}
  body.mode-mobile .geom-svg{max-width:100%}
  body.mode-mobile .step-row textarea{font-size:13px}
  /* AI feedback panel */
  .ai-feedback{margin-top:14px;background:linear-gradient(135deg,#faf5ff,#fdf4ff,#f0f9ff);border-radius:16px;padding:20px;border:2px solid #c4b5fd;display:flex;gap:20px;align-items:flex-start;box-shadow:0 4px 12px rgba(167,139,250,.15)}
  .ai-feedback.hidden{display:none}
  .score-box{flex-shrink:0;text-align:center;background:white;border-radius:14px;padding:14px 18px;border:2px solid #e9d5ff}
  .score-num{font-size:46px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
  .score-label{font-size:13px;color:#64748b;margin-top:2px;font-weight:600}
  .ai-analysis{flex:1}
  .ai-message{font-size:17px;font-weight:700;margin:0 0 10px;color:#1e293b}
  .ai-analysis ul{margin:6px 0;padding-right:20px}
  .ai-analysis li{font-size:14px;color:#475569;line-height:1.7}
  .ai-analysis .ok{color:#166534;font-weight:600}
  .ai-analysis .miss{color:#991b1b;font-weight:600}
  .btn-ai{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white}
  .btn-ai:disabled, .btn-ai.disabled{background:#e2e8f0 !important;color:#94a3b8 !important;cursor:not-allowed;box-shadow:none !important;transform:none !important}
  body.mode-mobile .ai-feedback{flex-direction:column;gap:12px;padding:16px}
  body.mode-mobile .score-box{align-self:center}
  /* Unseen reading passages */
  .passage-box{background:#f8fafc;padding:20px 22px;border-radius:14px;border-right:4px solid #6366f1;margin:14px 0;line-height:1.85;font-size:16px;color:#334155;direction:ltr;text-align:left}
  .passage-box .level-tag{display:inline-block;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:700;padding:4px 12px;border-radius:999px;font-size:13px;margin-bottom:12px;direction:rtl}
  .passage-box .passage-title{font-size:20px;font-weight:800;color:#1e293b;margin:0 0 14px}
  .passage-box .passage-text{margin:0;white-space:pre-line}
  .unseen-q{background:white;padding:14px 18px;border-radius:12px;border:1px solid #e2e8f0;margin:10px 0}
  .unseen-q .q-text{font-size:15px;margin-bottom:10px;color:#1e293b;font-weight:600;line-height:1.6}
  .q-options{display:flex;flex-direction:column;gap:6px}
  .q-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;cursor:pointer;transition:all .15s;background:white;direction:ltr;text-align:left}
  .q-option:hover{background:#f8fafc;border-color:#a78bfa}
  .q-option input[type="radio"]{margin-top:3px;flex-shrink:0}
  .q-option span{font-size:14px;color:#334155;line-height:1.5;flex:1}
  .q-option.correct{background:#dcfce7;border-color:#10b981}
  .q-option.wrong{background:#fee2e2;border-color:#ef4444}
  body.mode-mobile .passage-box{padding:14px;font-size:15px}
  body.mode-mobile .passage-box .passage-title{font-size:17px}
  body.mode-mobile .unseen-q{padding:12px}
  .unseen-open{background:white;padding:14px 18px;border-radius:12px;border:1px solid #e2e8f0;margin:10px 0}
  .unseen-open .q-text{font-size:15px;margin-bottom:10px;color:#1e293b;font-weight:600;line-height:1.6}
  .unseen-open .open-input{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;color:#1e293b;direction:ltr;text-align:left;line-height:1.5;resize:vertical;box-sizing:border-box;background:#fafbff}
  .unseen-open .open-input:focus{outline:none;border-color:#a78bfa;background:white}
  .unseen-open .open-hint{margin-top:8px;font-size:13px;color:#64748b;line-height:1.5;min-height:18px}
  .unseen-open .ok-tag{display:inline-block;background:#dcfce7;color:#15803d;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;margin-left:6px}
  .unseen-open .bad-tag{display:inline-block;background:#fee2e2;color:#b91c1c;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;margin-left:6px}
  .unseen-open .partial-tag{display:inline-block;background:#fef3c7;color:#a16207;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;margin-left:6px}
  .unseen-open.open-ok{border-color:#10b981;background:#f0fdf4}
  .unseen-open.open-bad{border-color:#ef4444;background:#fef2f2}
  .unseen-open.open-partial{border-color:#f59e0b;background:#fffbeb}
  body.mode-mobile .unseen-open{padding:12px}
  body.mode-mobile .unseen-open .open-input{min-height:70px;font-size:13px}
  /* ---- Quizlet-style vocab card ---- */
  .vocab-card{background:linear-gradient(180deg,#0f172a,#1e1b4b);color:#e2e8f0;border-radius:18px;padding:30px 32px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
  .vocab-card .vocab-progress{display:flex;align-items:center;gap:8px;margin-bottom:24px}
  .vocab-card .vocab-bars{display:flex;gap:6px;flex:1}
  .vocab-card .vocab-bar{height:8px;flex:1;background:rgba(148,163,184,.25);border-radius:999px;overflow:hidden;position:relative}
  .vocab-card .vocab-bar.done{background:#10b981}
  .vocab-card .vocab-bar.current{background:linear-gradient(90deg,#10b981 50%,rgba(148,163,184,.25) 50%)}
  .vocab-card .vocab-bar.current .vocab-bullet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#10b981;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .vocab-card .vocab-score{background:rgba(148,163,184,.18);color:#cbd5e1;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;min-width:42px;text-align:center}
  .vocab-card .vocab-term-label{color:#94a3b8;font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:6px;direction:ltr;text-align:left}
  .vocab-card .vocab-term{font-size:38px;font-weight:600;color:#f8fafc;margin:6px 0 32px;direction:ltr;text-align:left}
  .vocab-card .vocab-prompt{color:#cbd5e1;font-size:14px;margin-bottom:14px;font-weight:600}
  .vocab-card .vocab-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .vocab-card .vocab-opt{display:flex;align-items:center;gap:14px;background:rgba(30,27,75,.5);border:1.5px solid rgba(148,163,184,.25);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .15s;font-family:inherit;text-align:right;color:#e2e8f0}
  .vocab-card .vocab-opt:hover:not(:disabled){background:rgba(99,102,241,.18);border-color:#818cf8}
  .vocab-card .vocab-opt:disabled{cursor:default;opacity:.85}
  .vocab-card .vocab-opt .num{color:#94a3b8;font-weight:700;font-size:15px;min-width:18px;text-align:left}
  .vocab-card .vocab-opt .he{flex:1;font-size:18px;font-weight:600;color:#f1f5f9;text-align:right}
  .vocab-card .vocab-opt.correct{background:rgba(16,185,129,.22);border-color:#10b981;color:#bbf7d0}
  .vocab-card .vocab-opt.correct .he{color:#bbf7d0}
  .vocab-card .vocab-opt.wrong{background:rgba(239,68,68,.22);border-color:#ef4444;color:#fecaca}
  .vocab-card .vocab-opt.wrong .he{color:#fecaca}

function parseAns(s){
  if(s===undefined||s===null) return NaN;
  s = String(s).trim().replace(/\s/g,'').replace('−','-');
  if(s==='') return NaN;
  if(s.includes('/')){ const [n,d]=s.split('/').map(Number); if(!isFinite(n)||!isFinite(d)||d===0) return NaN; return n/d; }
  const v = Number(s); return isFinite(v)?v:NaN;
}
function refmath(){ if(window.renderMathInElement) renderMathInElement(root(),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); }

/* ====== Question card builder ====== */
function makeQuestion({html, answers, solution, regenerate}){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qbox">
      <div class="qhead">📝 שאלה</div>
      <div class="qtext">${html}</div>
      <div class="multi-q"></div>
      <div class="actions">
        <button class="btn btn-pink nx">🔄 שאלה אחרת</button>
        <button class="btn btn-success ck">✓ בדוק תשובה</button>
        <button class="btn btn-warn sol">💡 רמז ופתרון</button>
      </div>
      <div class="feedback fb"></div>
      <div class="reveal sl"></div>
    </div>`;
  const mq = wrap.querySelector('.multi-q');
  answers.forEach(a=>{
    const lab = document.createElement('label'); lab.textContent = a.label; mq.appendChild(lab);
    const inp = document.createElement('input'); inp.dataset.key = a.key; inp.placeholder = a.placeholder||''; mq.appendChild(inp);
  });
  let hasChecked = false;
  function runCheck(){
    const fb = wrap.querySelector('.fb');
    let correctCount = 0;
    const wrongLabels = [];
    let totalAnswered = 0;
    answers.forEach(a=>{
      const inp = mq.querySelector(`input[data-key="${a.key}"]`);
      const v = parseAns(inp.value);
      const hasInput = (inp.value||'').trim() !== '';
      let ok = false;
      if(a.check){ ok = a.check(inp.value); }
      else if(typeof a.correct === 'number'){ ok = !isNaN(v) && isClose(v,a.correct); }
      else if(Array.isArray(a.correct)){ ok = !isNaN(v) && a.correct.some(c=>isClose(c,v)); }
      else if(typeof a.correct === 'string'){ ok = (inp.value||'').trim().replace(/\s/g,'') === a.correct.replace(/\s/g,''); }
      if(ok){ correctCount++; }
      else { wrongLabels.push(a.label); }
      if(hasInput){ totalAnswered++; }
      // Color: green if correct, red if filled and wrong, neutral if empty
      if(ok){ inp.style.borderColor = '#10b981'; }
      else if(hasInput){ inp.style.borderColor = '#ef4444'; }
      else { inp.style.borderColor = '#e2e8f0'; }
    });
    const total = answers.length;
    if(correctCount === total){
      fb.className = 'feedback show ok';
      fb.textContent = '🎉 כל הכבוד! כל התשובות נכונות.';
    } else if(correctCount === 0){
      fb.className = 'feedback show bad';
      fb.textContent = totalAnswered === 0 ? '🤔 עדיין לא ענית על שום שדה.' : '✗ אף תשובה לא נכונה. נסה שוב או הצץ ברמז.';
    } else {
      // Partial — encourage and only point out what's wrong
      fb.className = 'feedback show partial';
      const wrongMsg = wrongLabels.length === 1
        ? `נשאר לתקן: <strong>${wrongLabels[0]}</strong>`
        : `נשאר לתקן: <strong>${wrongLabels.join(' · ')}</strong>`;
      fb.innerHTML = `✓ <strong>${correctCount} מתוך ${total}</strong> נכון. ${wrongMsg}`;
    }
  }
  wrap.querySelector('.ck').onclick = ()=>{
    hasChecked = true;
    runCheck();
  };
  // Live re-check on every input change after the first check
  mq.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(hasChecked){ runCheck(); }
    });
  });
  wrap.querySelector('.sol').onclick = ()=>{
    const sl = wrap.querySelector('.sl');
    sl.innerHTML = solution;
    sl.classList.add('show');
    refmath();
  };
  wrap.querySelector('.nx').onclick = ()=>regenerate && regenerate();
  return wrap;
}

/* ====== Stepped question card (for problems that need step-by-step solving) ====== */
function makeSteppedQuestion({html, steps, solution, regenerate}){
  // steps: [{ title, hint, inputs:[{key,label,correct,placeholder,check}] }]
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qbox">
      <div class="qhead">📝 שאלה</div>
      <div class="qtext">${html}</div>
      <div class="stepslot"></div>
      <div class="actions" style="margin-top:14px">
        <button class="btn btn-pink nx">🔄 שאלה אחרת</button>
        <button class="btn btn-warn sol">💡 פתרון מלא</button>
      </div>
      <div class="reveal sl"></div>
    </div>`;
  const slot = wrap.querySelector('.stepslot');

  function unlockStep(i){
    const card = slot.querySelectorAll('.stepcard')[i];
    if(card){ card.classList.remove('locked'); }
  }

  steps.forEach((st, idx)=>{
    const card = document.createElement('div');
    card.className = 'stepcard' + (idx===0?'':' locked');
    const inputsHtml = st.inputs.map(inp=>`
      <label>${inp.label}</label>
      <input data-key="${inp.key}" placeholder="${inp.placeholder||''}">
      <span></span>
    `).join('');
    card.innerHTML = `
      <div class="stepnum">${idx+1}</div>
      <div class="stepbody">
        <h4>${st.title}</h4>
        ${st.help ? `<div class="stephelp">${st.help}</div>` : ''}
        <div class="stepinputs">${inputsHtml}</div>
        <div class="stepactions">
          <button class="btn btn-success ckstep">✓ בדוק שלב</button>
          <button class="btn btn-secondary hintbtn">💡 רמז</button>
        </div>
        <div class="stephint">${st.hint || ''}</div>
        <div class="stepfb"></div>
      </div>`;
    card.querySelector('.hintbtn').onclick = ()=>{
      const h = card.querySelector('.stephint'); h.classList.toggle('show');
    };
    card.querySelector('.ckstep').onclick = ()=>{
      const inps = card.querySelectorAll('input');
      let ok = true;
      st.inputs.forEach((inp, i)=>{
        const el = inps[i];
        const v = parseAns(el.value);
        let good = false;
        if(inp.check){ good = inp.check(el.value); }
        else if(typeof inp.correct === 'number'){ good = !isNaN(v) && isClose(v,inp.correct); }
        else if(Array.isArray(inp.correct)){ good = !isNaN(v) && inp.correct.some(c=>isClose(c,v)); }
        else if(typeof inp.correct === 'string'){ good = (el.value||'').trim().replace(/\s/g,'') === inp.correct.replace(/\s/g,''); }
        if(!good) ok = false;
        el.style.borderColor = good?'#10b981':'#ef4444';
      });
      const fb = card.querySelector('.stepfb');
      fb.className = 'stepfb show ' + (ok?'ok':'bad');
      fb.textContent = ok ? '✓ נכון! עברו לשלב הבא.' : '✗ לא מדויק. נסו שוב או הציצו ברמז.';
      card.classList.remove('passed','failed');
      card.classList.add(ok?'passed':'failed');
      if(ok && idx+1 < steps.length){ unlockStep(idx+1); }
    };
    slot.appendChild(card);
  });

  wrap.querySelector('.sol').onclick = ()=>{
    const sl = wrap.querySelector('.sl');
    sl.innerHTML = solution;
    sl.classList.add('show');
    refmath();
  };
  wrap.querySelector('.nx').onclick = ()=>regenerate && regenerate();
  return wrap;
}

/* ====== SVG of parabola ====== */
function parabSVG(coeff,p,k,xMin=-7,xMax=7,yMin=-9,yMax=9,extras=[]){
  const W=380,H=280;
  const sx=v=>(v-xMin)/(xMax-xMin)*W;
  const sy=v=>H-(v-yMin)/(yMax-yMin)*H;
  function buildPath(c,pp,kk){
    let path=''; for(let x=xMin;x<=xMax;x+=0.1){ const y=c*Math.pow(x-pp,2)+kk; if(y<yMin-2||y>yMax+2)continue; path += (path?' L ':'M ')+sx(x).toFixed(1)+' '+sy(y).toFixed(1); }
    return path;
  }
  function buildStdPath(a,b,c){
    let path=''; for(let x=xMin;x<=xMax;x+=0.1){ const y=a*x*x+b*x+c; if(y<yMin-2||y>yMax+2)continue; path += (path?' L ':'M ')+sx(x).toFixed(1)+' '+sy(y).toFixed(1); }
    return path;
  }
  const path = buildPath(coeff,p,k);
  let grid=''; for(let i=Math.ceil(xMin);i<=Math.floor(xMax);i++){grid+=`<line x1="${sx(i)}" y1="0" x2="${sx(i)}" y2="${H}" stroke="#e2e8f0" stroke-width="1"/>`}
  for(let i=Math.ceil(yMin);i<=Math.floor(yMax);i++){grid+=`<line x1="0" y1="${sy(i)}" x2="${W}" y2="${sy(i)}" stroke="#e2e8f0" stroke-width="1"/>`}
  let extra='';
  extras.forEach(e=>{
    if(e.type==='point'){ extra += `<circle cx="${sx(e.x)}" cy="${sy(e.y)}" r="4" fill="${e.color||'#ef4444'}"/>`; if(e.label) extra += `<text x="${sx(e.x)+6}" y="${sy(e.y)-6}" font-size="12" fill="${e.color||'#ef4444'}" font-weight="700">${e.label}</text>`}
    if(e.type==='vline'){ extra += `<line x1="${sx(e.x)}" y1="0" x2="${sx(e.x)}" y2="${H}" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4"/>`; }
    if(e.type==='line'){ const x1=xMin,x2=xMax; extra += `<line x1="${sx(x1)}" y1="${sy(e.m*x1+e.n)}" x2="${sx(x2)}" y2="${sy(e.m*x2+e.n)}" stroke="${e.color||'#0891b2'}" stroke-width="2"/>`; }
    if(e.type==='parab'){ extra += `<path d="${buildPath(e.coeff,e.p||0,e.k||0)}" stroke="${e.color||'#ec4899'}" stroke-width="2.5" fill="none"/>`; }
    if(e.type==='parab-std'){ extra += `<path d="${buildStdPath(e.a,e.b,e.c)}" stroke="${e.color||'#ec4899'}" stroke-width="2.5" fill="none"/>`; }
    if(e.type==='polygon'){ const pts=e.points.map(pt=>`${sx(pt[0])},${sy(pt[1])}`).join(' '); extra += `<polygon points="${pts}" fill="${e.fill||'rgba(99,102,241,0.18)'}" stroke="${e.stroke||'#4338ca'}" stroke-width="2"/>`; e.points.forEach((pt,i)=>{ if(e.labels&&e.labels[i]) extra += `<text x="${sx(pt[0])+6}" y="${sy(pt[1])-6}" font-size="13" fill="#1e293b" font-weight="700">${e.labels[i]}</text>`; }); }
  });
  return `<svg class="parabola" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${grid}
    <line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" stroke="#475569" stroke-width="1.5"/>
    <line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" stroke="#475569" stroke-width="1.5"/>
    <text x="${W-12}" y="${sy(0)-6}" font-size="12" fill="#475569">x</text>
    <text x="${sx(0)+6}" y="14" font-size="12" fill="#475569">y</text>
    <path d="${path}" stroke="#6366f1" stroke-width="2.5" fill="none"/>${extra}</svg>`;
}

/* Helper: SVG of just a coordinate plane with a polygon (for analytic geometry examples) */
function planeSVG(xMin,xMax,yMin,yMax,extras=[]){
  return parabSVG(0,0,yMax+100, xMin, xMax, yMin, yMax, extras).replace(/<path d="[^"]*" stroke="#6366f1"[^>]*\/>/, '');
}

/* ====== Topic Definitions ====== */
const topicDefs = {};

/* ---- Vertical translation y = x^2 + k ---- */
topicDefs['parab-vert'] = {
  title:'הזזה אנכית של פרבולה',
  lesson:`
    <h3 style="margin-top:0">הצורה $y = x^2 + k$</h3>
    <div class="lesson">
      <p>הפונקציה $y = x^2 + k$ היא הפרבולה הבסיסית $y=x^2$ שזזה אנכית.</p>
      <ul>
        <li>אם $k>0$ הפרבולה זזה למעלה.</li>
        <li>אם $k<0$ הפרבולה זזה למטה.</li>
        <li>קודקוד: $(0,k)$ והוא תמיד מינימום.</li>
        <li>ציר סימטריה: $x = 0$.</li>
        <li>חיתוך עם ציר $y$: $(0,k)$.</li>
        <li>חיתוך עם ציר $x$: $x = \\pm\\sqrt{-k}$ (קיים רק כאשר $k<0$).</li>
        <li>תחום עלייה: $x>0$. תחום ירידה: $x<0$.</li>
      </ul>
    </div>
    <div class="formula">קודקוד $(0,k)$ &nbsp;·&nbsp; אפסים: $x = \\pm\\sqrt{-k}$ (אם $k<0$)</div>`,
  example:`
    <h3 style="margin-top:0">דוגמה: $y = x^2 - 4$</h3>
    ${parabSVG(1,0,-4,-6,6,-6,8,[
      {type:'point',x:0,y:-4,label:'V',color:'#dc2626'},
      {type:'point',x:2,y:0,color:'#059669'},
      {type:'point',x:-2,y:0,color:'#059669'}
    ])}
    <div class="example">
      <div class="step">קודקוד: כאן $k = -4$, אז הקודקוד הוא $(0, -4)$.</div>
      <div class="step">ציר סימטריה: $x = 0$.</div>
      <div class="step">חיתוך עם ציר $y$: מציבים $x=0$ ומקבלים $y = -4$, כלומר $(0, -4)$.</div>
      <div class="step">חיתוך עם ציר $x$: $x^2 - 4 = 0 \\Rightarrow x^2 = 4 \\Rightarrow x = \\pm 2$.</div>
      <div class="step">תחום עלייה: $x>0$. תחום ירידה: $x<0$.</div>
    </div>`,
  makeQuestion:(slot)=>{
    function gen(){
      // Choose k so that when k<0, -k is a perfect square (so roots are integers)
      const k = pick([-1,-4,-9,-16,-25,1,2,3,4,5,7,9]);
      const hasRoots = k<0;
      const root = hasRoots ? Math.sqrt(-k) : null;
      const extras = [{type:'point',x:0,y:k,label:'V',color:'#dc2626'}];
      if(hasRoots){
        extras.push({type:'point',x:root,y:0,color:'#059669'});

      }
      const svg = parabSVG(1,0,k,-6,6,Math.min(k-2,-3),Math.max(k+8,8),extras);
      slot.innerHTML='';
      slot.appendChild(makeQuestion({
        html:`נתונה הפונקציה $y = x^2 ${k>=0?'+ '+k:'- '+(-k)}$.<br>${svg}`,
        answers:[
          {key:'vx',label:'שיעור x של הקודקוד',correct:0},
          {key:'vy',label:'שיעור y של הקודקוד',correct:k},
          {key:'sym',label:'משוואת ציר הסימטריה (x=)',correct:0},
          {key:'yint',label:'חיתוך עם ציר y',correct:k},
          {key:'roots',label:'מספר נקודות חיתוך עם ציר x',correct: hasRoots?2:0},
        ],
        solution: `
          <h4>פתרון מלא</h4>
          <div class="step">בפונקציה $y=x^2+k$ אין הזזה אופקית, לכן שיעור x של הקודקוד הוא 0.</div>
          <div class="step">$k = ${k}$, אז שיעור y של הקודקוד הוא $${k}$. הקודקוד: $(0, ${k})$.</div>
          <div class="step">ציר הסימטריה: $x = 0$.</div>
          <div class="step">חיתוך עם ציר y: מציבים $x=0$ ומקבלים $y = ${k}$.</div>
          <div class="step">חיתוך עם ציר x: $x^2 ${k>=0?'+ '+k:'- '+(-k)} = 0 \\Rightarrow x^2 = ${-k}$. ${hasRoots?`$x = \\pm\\sqrt{${-k}}$ ולכן יש 2 נקודות.`:`$x^2 \\geq 0$ ו-$${-k}<0$ לא יתכן, אין פתרון. 0 נקודות חיתוך.`}</div>
        `,
        regenerate: gen
      }));
      refmath();
    }
    gen();
  }
};

topicDefs['parab-comb'] = {

      <div class="step">ציר סימטריה: $x = 2$.</div>

        ],
        solution:`
          <h4>פתרון מלא</h4>
          <div class="step">הצורה $y = a(x-p)^2+k$ עם $a=${a},\\;p=${p},\\;k=${k}$.</div>
          <div class="step">קודקוד: $(${p}, ${k})$. כיוון ש-$a${a>0?'>0':'<0'}$, הקודקוד הוא ${a>0?'מינימום':'מקסימום'}.</div>
          <div class="step">חיתוך עם ציר y: $y = ${a}\\cdot(0-${p})^2 + ${k} = ${a*p*p} + ${k} = ${yint}$.</div>
          <div class="step">שורשים: $${a}(x-${p})^2 ${ktxt} = 0 \\Rightarrow (x-${p})^2 = ${(-k/a)} \\Rightarrow x = ${p} \\pm \\sqrt{${(-k/a)}}$. הפתרונות: $${r1},\\;${r2}$.</div>
        `,
        regenerate:gen
      }));
      refmath();
    }
    gen();
  }

/* ---- Standard form ---- */
topicDefs['parab-std'] = {
  title:'הצגה סטנדרטית',
  lesson:`
    <h3 style="margin-top:0">הצורה $y = ax^2 + bx + c$</h3>
    <div class="lesson">
      <p>הצורה הסטנדרטית של פונקציה ריבועית. כדי לחקור אותה משתמשים בנוסחאות:</p>
      <ul>
        <li>ציר סימטריה ושיעור x של קודקוד: $x = -\\dfrac{b}{2a}$.</li>
        <li>שיעור y של קודקוד: מציבים את ה-x הזה בפונקציה.</li>
        <li>חיתוך עם ציר $y$: $y = c$.</li>
        <li>חיתוך עם ציר $x$ (נוסחת השורשים): $x_{1,2} = \\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}$.</li>
        <li>דיסקרימיננטה $\\Delta = b^2 - 4ac$. אם $\\Delta>0$ שני שורשים, אם $\\Delta=0$ שורש יחיד, אם $\\Delta<0$ אין שורשים.</li>
      </ul>
    </div>
    <div class="formula">$x_{vertex} = -\\dfrac{b}{2a}$ &nbsp;·&nbsp; $x_{1,2} = \\dfrac{-b \\pm \\sqrt{b^2-4ac}}{2a}$</div>`,
  example:`
    <h3 style="margin-top:0">דוגמה: $y = x^2 - 2x - 8$</h3>
    ${parabSVG(1,1,-9,-4,7,-11,5,[
      {type:'point',x:1,y:-9,label:'V',color:'#dc2626'},
      {type:'point',x:-2,y:0,color:'#059669'},
      {type:'point',x:4,y:0,color:'#059669'},
      {type:'point',x:0,y:-8,color:'#0891b2',label:'(0,-8)'},
      {type:'vline',x:1}
    ])}
    <div class="example">
      <div class="step">מקדמים: $a=1,\\;b=-2,\\;c=-8$.</div>
      <div class="step">$x_{vertex} = -\\dfrac{-2}{2\\cdot 1} = 1$.</div>
      <div class="step">$y_{vertex} = 1^2 - 2\\cdot 1 - 8 = -9$. הקודקוד: $(1, -9)$.</div>
      <div class="step">חיתוך עם ציר $y$: $y = c = -8$, כלומר $(0, -8)$.</div>
      <div class="step">דיסקרימיננטה: $\\Delta = (-2)^2 - 4\\cdot 1\\cdot(-8) = 4 + 32 = 36$.</div>
      <div class="step">שורשים: $x = \\dfrac{2 \\pm 6}{2}$, כלומר $x = -2$ או $x = 4$.</div>
    </div>`,
  makeQuestion:(slot)=>{
    function gen(){
      const a = pick([1,-1,1,1,-1]);
      // r1+r2 must be even so vertex x is integer
      let r1 = rint(-5,5);
      let r2 = rint(-5,5);
      while(r2===r1 || (r1+r2)%2 !== 0){ r2 = rint(-5,5); }
      const b = -a*(r1+r2);
      const c = a*r1*r2;
      const vx = -b/(2*a);
      const vy = a*vx*vx + b*vx + c;
      const sgn = (n,first=false)=> (n>=0?(first?'':' + ')+n:' - '+(-n));
      const expr = `${a===1?'':a===-1?'-':a}x^2${sgn(b)}x${sgn(c)}`;

          {key:'vy',label:'שיעור y של הקודקוד',correct:vy},
          {key:'yint',label:'חיתוך עם ציר y',correct:c},
          {key:'r1',label:'שורש קטן יותר',correct:Math.min(r1,r2)},
          {key:'r2',label:'שורש גדול יותר',correct:Math.max(r1,r2)},
        ],

/* ---- Parabola line intersection (matches PDF Q2 style: 7 labeled points) ---- */
function fmtDownParab(B, C){
  const bs = B === 0 ? '' : B > 0 ? ` + ${B===1?'':B}x` : ` - ${B===-1?'':-B}x`;
  const cs = C === 0 ? '' : C > 0 ? ` + ${C}` : ` - ${-C}`;
  return `-x^2${bs}${cs}`;
}
function fmtLine(m, n){
  const ms = m === 1 ? 'x' : m === -1 ? '-x' : `${m}x`;
  const ns = n === 0 ? '' : n > 0 ? ` + ${n}` : ` - ${-n}`;
  return `${ms}${ns}`;
}

/* ---- Two parabolas (real, varied parabolas with integer intersections, labels A and B) ---- */
function fmtUpParab(b, c){
  const bs = b === 0 ? '' : b > 0 ? ` + ${b===1?'':b}x` : ` - ${b===-1?'':-b}x`;
  const cs = c === 0 ? '' : c > 0 ? ` + ${c}` : ` - ${-c}`;
  return `x^2${bs}${cs}`;
}

/* ---- Geometry diagram helpers ---- */
function geomTickMark(p1, p2, count){
  const [x1,y1]=p1,[x2,y2]=p2;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const px=-dy/len, py=dx/len;
  const tx=dx/len, ty=dy/len;
  const tickLen=0.18, spacing=0.12;
  const offsets = count===1?[0]:count===2?[-spacing/2,spacing/2]:[-spacing,0,spacing];
  let svg='';
  for(const off of offsets){
    const cx=mx+tx*off, cy=my+ty*off;
    svg += `<line x1="${cx-px*tickLen}" y1="${cy-py*tickLen}" x2="${cx+px*tickLen}" y2="${cy+py*tickLen}" stroke="#dc2626" stroke-width="0.07" stroke-linecap="round"/>`;
  }
  return svg;
}
function geomParallelMark(p1, p2, count){
  const [x1,y1]=p1,[x2,y2]=p2;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const tx=dx/len, ty=dy/len;
  const px=-dy/len, py=dx/len;
  const armLen=0.22, armWidth=0.16;
  const offsets = count===1?[0]:[-0.18,0.18];
  let svg='';
  for(const off of offsets){
    const cx=mx+tx*off, cy=my+ty*off;
    const ax=cx-tx*armLen+px*armWidth, ay=cy-ty*armLen+py*armWidth;
    const bx=cx-tx*armLen-px*armWidth, by=cy-ty*armLen-py*armWidth;
    svg += `<polyline points="${ax},${ay} ${cx},${cy} ${bx},${by}" fill="none" stroke="#059669" stroke-width="0.07" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return svg;
}
function geomRightAngle(vertex, p1, p2){
  const [vx,vy]=vertex,[x1,y1]=p1,[x2,y2]=p2;
  const d1x=x1-vx, d1y=y1-vy, d2x=x2-vx, d2y=y2-vy;
  const l1=Math.sqrt(d1x*d1x+d1y*d1y)||1, l2=Math.sqrt(d2x*d2x+d2y*d2y)||1;
  const u1x=d1x/l1, u1y=d1y/l1, u2x=d2x/l2, u2y=d2y/l2;
  const sz=0.3;
  return `<polyline points="${vx+u1x*sz},${vy+u1y*sz} ${vx+u1x*sz+u2x*sz},${vy+u1y*sz+u2y*sz} ${vx+u2x*sz},${vy+u2y*sz}" fill="none" stroke="#dc2626" stroke-width="0.07"/>`;
}
function geomAngleArc(vertex, p1, p2, label, color='#7c3aed'){
  const [vx,vy]=vertex,[x1,y1]=p1,[x2,y2]=p2;
  const d1x=x1-vx, d1y=y1-vy, d2x=x2-vx, d2y=y2-vy;
  const l1=Math.sqrt(d1x*d1x+d1y*d1y)||1, l2=Math.sqrt(d2x*d2x+d2y*d2y)||1;
  const r=0.5;
  const ax=vx+d1x/l1*r, ay=vy+d1y/l1*r;
  const bx=vx+d2x/l2*r, by=vy+d2y/l2*r;
  let svg = `<path d="M ${ax} ${ay} A ${r} ${r} 0 0 1 ${bx} ${by}" fill="none" stroke="${color}" stroke-width="0.06"/>`;
  if(label){
    const mx=(d1x/l1+d2x/l2)/2, my=(d1y/l1+d2y/l2)/2;
    const ml=Math.sqrt(mx*mx+my*my)||1;
    svg += `<text x="${vx+mx/ml*0.85}" y="${vy+my/ml*0.85}" font-size="0.4" fill="${color}" text-anchor="middle" font-weight="700">${label}</text>`;
  }
  return svg;
}
function renderGeomElement(el, pts){
  if(el.type==='polygon'){
    const points = el.vs.map(n => pts[n].join(',')).join(' ');
    return `<polygon points="${points}" fill="rgba(99,102,241,0.07)" stroke="#1e293b" stroke-width="0.08" stroke-linejoin="round"/>`;
  }
  if(el.type==='segment'){
    const [x1,y1]=pts[el.from], [x2,y2]=pts[el.to];
    const dash = el.dash?'stroke-dasharray="0.25 0.18"':'';
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${el.color||'#1e293b'}" stroke-width="${el.width||0.08}" ${dash}/>`;
  }
  if(el.type==='tick-marks'){
    return el.segments.map(([f,t])=>geomTickMark(pts[f],pts[t],el.style||1)).join('');
  }
  if(el.type==='parallel-marks'){
    return el.segments.map(([f,t])=>geomParallelMark(pts[f],pts[t],el.style||1)).join('');
  }
  if(el.type==='right-angle'){
    return geomRightAngle(pts[el.vertex], pts[el.from], pts[el.to]);
  }
  if(el.type==='angle-arc'){
    return geomAngleArc(pts[el.vertex], pts[el.from], pts[el.to], el.label, el.color);
  }
  return '';
}
function geomSVG(diagram, activeFacts){
  const { viewBox, points, initial=[], facts=[], labelOffsets={} } = diagram;
  let elements = [...initial];
  for(const f of facts){
    if(activeFacts.has(f.id) && f.draw){
      elements = elements.concat(f.draw);
    }
  }
  let svg = `<svg viewBox="${viewBox.join(' ')}" xmlns="http://www.w3.org/2000/svg" class="geom-svg">`;
  for(const el of elements){
    svg += renderGeomElement(el, points);
  }
  for(const [name, [x, y]] of Object.entries(points)){
    const offset = labelOffsets[name] || [0.25, -0.25];
    svg += `<circle cx="${x}" cy="${y}" r="0.1" fill="#1e293b"/>`;
    svg += `<text x="${x + offset[0]}" y="${y + offset[1]}" font-size="0.55" font-weight="800" fill="#1e293b">${name}</text>`;
  }
  svg += '</svg>';
  return svg;
}

function normalizeText(s){
  // Lowercase + remove all whitespace + normalize quotes/symbols
  return (s||'').toLowerCase().replace(/\s+/g,'').replace(/[״"׳']/g,'');
}
function makeProofTopic(title, lessonHTML, exampleHTML, problemBank){
  return {
    title,
    lesson: lessonHTML,
    example: exampleHTML,
    makeQuestion:(slot)=>{
      function gen(){
        const p = pick(problemBank);
        const activeFacts = new Set();
        slot.innerHTML='';
        const wrap = document.createElement('div');
        const diagramHTML = p.diagram ? `<div class="diagram-container"></div>` : '';
        wrap.innerHTML = `
          <div class="qbox">
            <div class="qhead">📝 בעיה</div>
            <div class="qtext"><strong>${p.title}</strong><br>${p.problem}</div>
            ${diagramHTML}
            <div class="proof-steps">
              <h4>✏️ הפתרון שלי (ככל שתכתבו, הציור יתעדכן):</h4>
              <div class="step-rows">
                <div class="step-row">
                  <span class="step-num">1</span>
                  <textarea placeholder="כתבו את השלב הראשון..." rows="1"></textarea>
                  <button class="step-remove" title="הסר שלב" style="visibility:hidden">✕</button>
                </div>
              </div>
              <button class="add-step-btn">+ הוסף שלב</button>
            </div>
            <div class="actions">
              <button class="btn btn-pink nx">🔄 שאלה אחרת</button>
              <button class="btn btn-ai aibtn">🤖 משוב AI</button>
              <button class="btn btn-warn hint">💡 רמז הבא</button>
              <button class="btn btn-success show">📖 הצג הוכחה מלאה</button>
            </div>
            <div class="ai-feedback hidden"></div>
            <div class="reveal sl"></div>
          </div>`;

        // Render diagram
        const diagramContainer = wrap.querySelector('.diagram-container');
        function renderDiagram(){
          if(p.diagram && diagramContainer){
            diagramContainer.innerHTML = geomSVG(p.diagram, activeFacts);
          }
        }
        renderDiagram();

        const stepRows = wrap.querySelector('.step-rows');
        const addBtn = wrap.querySelector('.add-step-btn');
        const aiBtn = wrap.querySelector('.aibtn');
        const aiFb = wrap.querySelector('.ai-feedback');

        let hintsShown = 0;
        let proofShown = false;
        function isAIBlocked(){
          return proofShown || (p.hints && hintsShown >= p.hints.length);
        }
        function updateAIBtnState(){
          if(isAIBlocked()){
            aiBtn.classList.add('disabled');
            aiBtn.disabled = true;
            aiBtn.title = 'אי אפשר לקבל משוב אחרי שהשתמשת בכל הרמזים או שראית את הפתרון המלא';
          }
        }

        function recomputeFactsFromText(){
          if(!p.diagram || !p.diagram.facts){ return; }
          const allText = Array.from(stepRows.querySelectorAll('textarea'))
            .map(t => normalizeText(t.value))
            .join(' ');
          const before = new Set(activeFacts);
          activeFacts.clear();
          for(const fact of p.diagram.facts){
            if(!fact.triggers) continue;
            for(const trig of fact.triggers){
              if(allText.includes(normalizeText(trig))){
                activeFacts.add(fact.id);
                break;
              }
            }
          }
          let changed = before.size !== activeFacts.size;
          if(!changed){
            for(const id of before){ if(!activeFacts.has(id)){ changed = true; break; } }
          }
          if(changed){ renderDiagram(); }
        }

        function attachInputListener(textarea){
          textarea.addEventListener('input', recomputeFactsFromText);
        }
        wrap.querySelectorAll('textarea').forEach(attachInputListener);

        function addStepRow(){
          const num = stepRows.children.length + 1;
          const row = document.createElement('div');
          row.className = 'step-row';
          row.innerHTML = `
            <span class="step-num">${num}</span>
            <textarea placeholder="כתבו את שלב ${num}..." rows="1"></textarea>
            <button class="step-remove" title="הסר שלב">✕</button>`;
          row.querySelector('.step-remove').onclick = ()=>{
            row.remove();
            stepRows.querySelectorAll('.step-row').forEach((r, i)=>{
              r.querySelector('.step-num').textContent = i+1;
              const ta = r.querySelector('textarea');
              if(ta && ta.placeholder.startsWith('כתבו את שלב')){
                ta.placeholder = `כתבו את שלב ${i+1}...`;
              }
            });
            recomputeFactsFromText();
          };
          attachInputListener(row.querySelector('textarea'));
          stepRows.appendChild(row);
        }
        addBtn.onclick = addStepRow;

        // AI scoring & feedback
        function aiAnalyze(){
          const allText = Array.from(stepRows.querySelectorAll('textarea')).map(t=>t.value).join('\n');
          const norm = normalizeText(allText);
          const facts = (p.diagram && p.diagram.facts) || [];
          const found = [], missing = [];
          for(const f of facts){
            const hit = (f.triggers||[]).some(t => norm.includes(normalizeText(t)));
            (hit ? found : missing).push(f);
          }
          const conclusion = p.finalConclusion || null;
          const concHit = conclusion ? (conclusion.triggers||[]).some(t => norm.includes(normalizeText(t))) : false;

          // Length score - encourages writing actual sentences
          const wordCount = allText.trim().split(/\s+/).filter(Boolean).length;
          const writingScore = wordCount < 5 ? 0 : (wordCount < 15 ? 5 : 10);

          const conceptPart = facts.length > 0 ? (found.length / facts.length) * 60 : 0;
          const conclusionPart = concHit ? 30 : 0;
          const score = Math.min(100, Math.round(conceptPart + conclusionPart + writingScore));

          let label, color;
          if(wordCount < 3){ label = '🤔 לא כתבת כמעט כלום'; color = '#dc2626'; }
          else if(score >= 90){ label = '🌟 מצוין! ההוכחה שלך מקיפה ומדויקת'; color = '#059669'; }
          else if(score >= 70){ label = '👍 טוב מאוד, יש מקום לשיפור קטן'; color = '#0891b2'; }
          else if(score >= 50){ label = '🙂 התקדמת יפה, יש עוד מה לעבוד'; color = '#f59e0b'; }
          else if(score >= 25){ label = '✏️ התחלה טובה, אבל חסרים שלבים מרכזיים'; color = '#f97316'; }
          else{ label = '📚 צריך עבודה נוספת. נסה לפרק את הבעיה צעד צעד'; color = '#dc2626'; }

          const trigName = (f) => (f.triggers && f.triggers[0]) || f.id;
          const foundList = found.length ? `<div><strong class="ok">✓ זיהית:</strong><ul>${found.map(f=>`<li>${trigName(f)}</li>`).join('')}</ul></div>` : '';
          const missList = missing.length ? `<div><strong class="miss">✗ חסר:</strong><ul>${missing.map(f=>`<li>${trigName(f)}</li>`).join('')}</ul></div>` : '';
          const conclMsg = conclusion ? (concHit ? `<div><strong class="ok">✓ הגעת למסקנה הסופית: ${conclusion.name}</strong></div>` : `<div><strong class="miss">✗ לא הזכרת את המסקנה הסופית: ${conclusion.name}</strong></div>`) : '';

          aiFb.innerHTML = `
            <div class="score-box">
              <div class="score-num">${score}</div>
              <div class="score-label">/ 100</div>
            </div>
            <div class="ai-analysis">
              <p class="ai-message">${label}</p>
              ${foundList}
              ${missList}
              ${conclMsg}
            </div>`;
          aiFb.classList.remove('hidden');
          refmath();
        }

        aiBtn.onclick = ()=>{
          if(isAIBlocked()){
            return;
          }
          aiAnalyze();
        };

        const sl = wrap.querySelector('.sl');
        wrap.querySelector('.hint').onclick = ()=>{
          if(hintsShown >= p.hints.length){ return; }
          hintsShown++;
          sl.classList.add('show');
          sl.innerHTML = '<h4>רמזים:</h4>' + p.hints.slice(0,hintsShown).map((h,i)=>`<div class="step">${i+1}. ${h}</div>`).join('');
          updateAIBtnState();
          refmath();
        };
        wrap.querySelector('.show').onclick = ()=>{
          proofShown = true;
          sl.classList.add('show');
          sl.innerHTML = '<h4>הוכחה מלאה:</h4>' + p.hints.map((h,i)=>`<div class="step">${i+1}. ${h}</div>`).join('');
          updateAIBtnState();
          refmath();
        };
        wrap.querySelector('.nx').onclick = gen;
        slot.appendChild(wrap);
        refmath();
      }
      gen();
    }
  };
}

function normalizeHe(s){
  return (s||'').replace(/\s+/g,'').replace(/[״"׳']/g,'').replace(/[()]/g,'').toLowerCase();
}
function normalizeEn(s){
  return (s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function checkHebrewAnswer(userAns, correctHe){
  const u = normalizeHe(userAns);
  if(!u) return false;
  const variants = correctHe.split(/[\/,]/).map(s=>normalizeHe(s)).filter(Boolean);
  return variants.some(v => v === u || v.includes(u) || u.includes(v));
}
function checkEnglishAnswer(userAns, correctEn){
  const u = normalizeEn(userAns);
  if(!u) return false;
  return u === normalizeEn(correctEn);
}

topicDefs['vocab-en-he'] = {
  title:'אוצר מילים — מאנגלית לעברית',
  lesson:`
    <h3 style="margin-top:0">תרגום מאנגלית לעברית</h3>
    <div class="lesson">
      <p>בכל שאלה תופיע מילה באנגלית. עליכם לבחור את התרגום הנכון לעברית מתוך 4 אפשרויות.</p>
      <p>המאגר כולל את כל המילים מהעבודה: אותיות R, S, T, U.</p>
      <p>הסבב כולל 8 שאלות, וניתן צבירת ניקוד עבור כל תשובה נכונה.</p>
    </div>`,
  example:`
    <h3 style="margin-top:0">דוגמה</h3>
    <div class="example">
      <div class="step">המילה באנגלית: <strong>reason</strong></div>
      <div class="step">אפשרויות: 1) רגיל &nbsp; 2) סיבה &nbsp; 3) מכירה &nbsp; 4) להקים</div>
      <div class="step">תשובה נכונה: <strong>2 — סיבה</strong></div>
    </div>`,
  makeQuestion:(slot)=>{
    const ROUND_SIZE = 8;
    const POINTS_PER = 50;
    const round = {idx: 0, score: 0, words: []};
    function startRound(){
      // Shuffle vocab list & pick ROUND_SIZE
      const pool = vocabList.slice();
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      round.idx = 0; round.score = 0; round.words = pool.slice(0, ROUND_SIZE);
      renderQuestion();
    }
    function shortHe(he){
      // Take first variant (split by / or ,) for cleaner display
      return he.split(/[\/,]/)[0].trim();
    }
    function renderQuestion(){
      slot.innerHTML='';
      if(round.idx >= round.words.length){
        renderSummary();
        return;
      }
      const word = round.words[round.idx];
      const correctHe = shortHe(word.he);
      // Build distractors from other vocab words (different he)
      const distractorPool = vocabList.filter(w => w.en !== word.en && shortHe(w.he) !== correctHe);
      // Shuffle and take 3 unique by Hebrew display
      const seen = new Set([correctHe]);
      const distractors = [];
      const dShuffled = distractorPool.slice();
      for(let i = dShuffled.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [dShuffled[i], dShuffled[j]] = [dShuffled[j], dShuffled[i]];
      }
      for(const w of dShuffled){
        const h = shortHe(w.he);
        if(!seen.has(h)){ seen.add(h); distractors.push(h); }
        if(distractors.length === 3) break;
      }
      const options = [correctHe, ...distractors];
      // Shuffle options
      for(let i = options.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      const correctIdx = options.indexOf(correctHe);

      // Build progress bars
      const totalBars = round.words.length;
      const barsHtml = Array.from({length: totalBars}).map((_, i)=>{
        if(i < round.idx) return `<div class="vocab-bar done"></div>`;
        if(i === round.idx) return `<div class="vocab-bar current"><div class="vocab-bullet">${round.idx+1}</div></div>`;
        return `<div class="vocab-bar"></div>`;
      }).join('');

      const optsHtml = options.map((he, i)=>`
        <button class="vocab-opt" data-idx="${i}">
          <span class="num">${i+1}</span>
          <span class="he">${he}</span>
        </button>
      `).join('');

      const card = document.createElement('div');
      card.className = 'vocab-card';
      card.innerHTML = `
        <div class="vocab-progress">
          <div class="vocab-bars">${barsHtml}</div>
          <div class="vocab-score">${round.score}</div>
        </div>
        <div class="vocab-term-label">Term</div>
        <div class="vocab-term">${word.en}</div>
        <div class="vocab-prompt">בחרו את התרגום לעברית</div>
        <div class="vocab-options">${optsHtml}</div>
        <div class="vocab-foot">
          <div class="vocab-fb"></div>
          <div class="vocab-actions">
            <button class="btn btn-pink restart">🔄 סבב חדש</button>
            <button class="vocab-dont-know">לא יודע/ת?</button>
          </div>
        </div>
      `;
      slot.appendChild(card);

      const fb = card.querySelector('.vocab-fb');
      const optBtns = card.querySelectorAll('.vocab-opt');
      let answered = false;
      function lockAndAdvance(showCorrect){
        answered = true;
        optBtns.forEach((b, i)=>{
          b.disabled = true;
          if(showCorrect && i === correctIdx) b.classList.add('correct');
        });
        setTimeout(()=>{ round.idx++; renderQuestion(); }, 1200);
      }
      optBtns.forEach((btn, i)=>{
        btn.addEventListener('click', ()=>{
          if(answered) return;
          if(i === correctIdx){
            btn.classList.add('correct');
            round.score += POINTS_PER;
            fb.className = 'vocab-fb ok';
            fb.textContent = `✓ נכון! +${POINTS_PER} נקודות`;
          } else {
            btn.classList.add('wrong');
            fb.className = 'vocab-fb bad';
            fb.textContent = `✗ לא נכון. התרגום הנכון: ${correctHe}`;
          }
          lockAndAdvance(true);
        });
      });
      card.querySelector('.vocab-dont-know').addEventListener('click', ()=>{
        if(answered) return;
        fb.className = 'vocab-fb bad';
        fb.textContent = `התרגום הנכון: ${correctHe}`;
        lockAndAdvance(true);
      });
      card.querySelector('.restart').addEventListener('click', startRound);
      refmath();
    }
    function renderSummary(){
      const max = round.words.length * POINTS_PER;
      const pct = Math.round((round.score / max) * 100);
      let msg = '🎉 כל הכבוד!';
      if(pct < 60) msg = '💪 נסה שוב — אתה משתפר!';
      else if(pct < 90) msg = '👍 יפה מאוד!';
      const card = document.createElement('div');
      card.className = 'vocab-card';
      card.innerHTML = `
        <div class="vocab-term-label">Round Complete</div>
        <div class="vocab-term" style="font-size:30px">${msg}</div>
        <div class="vocab-prompt">הציון שלך</div>
        <div style="font-size:48px;font-weight:800;color:#86efac;margin:8px 0 4px;direction:ltr;text-align:left">${round.score} / ${max}</div>
        <div style="color:#cbd5e1;font-size:16px;margin-bottom:24px;direction:ltr;text-align:left">${pct}% תשובות נכונות</div>
        <div class="vocab-foot">
          <div class="vocab-fb"></div>
          <div class="vocab-actions">
            <button class="btn btn-success restart">🔄 סבב חדש</button>
          </div>
        </div>
      `;
      slot.innerHTML = '';
      slot.appendChild(card);
      card.querySelector('.restart').addEventListener('click', startRound);
    }
    startRound();
  }
};

    title: 'The Paradox of Choice',
    text: `Walk into any large supermarket and you will find dozens of types of bread, hundreds of brands of cereal, and an endless wall of yogurts. For most of human history, people had very few options. Today, in many parts of the world, choice is everywhere. Most of us think this is a good thing — but psychologists are not so sure.\n\nThe American researcher Barry Schwartz called this phenomenon "the paradox of choice". His main argument is that, beyond a certain point, more options do not make us happier. In fact, they often have the opposite effect. When we face many similar products, we spend more time deciding, we worry about making the wrong choice, and we feel guilty about the options we did not pick. Even after we choose, we keep wondering whether something else would have been better.\n\nThis is true not only for shopping but also for big life decisions. Where to study, what career to follow, where to live — modern people often face many possibilities, and this freedom can become a heavy weight. People who try to find "the best" option in every area of life tend to feel less satisfied than those who simply choose something "good enough".\n\nNone of this means that choice itself is bad. The freedom to choose a job, a partner or a religion is a real achievement of modern society. The problem starts when small daily decisions also become long, stressful processes. To live well, Schwartz suggests, we need to limit our choices on purpose, accept that no decision is perfect, and learn to enjoy what we already have.`,

  makeQuestion:(slot)=>{
    function gen(){
      const passage = pick(unseenPassages);

      const wrap = document.createElement('div');

      const mcHtml = passage.questions.map((qObj, qi)=>{

          <div class="unseen-open-questions">${openHtml}</div>
        ` : ''}
        <div class="actions" style="margin-top:14px">
          <button class="btn btn-pink nx">🔄 קטע אחר</button>
          <button class="btn btn-success ck">✓ בדוק תשובות</button>

        </div>
        <div class="feedback fb"></div>
        <div class="reveal sl"></div>
      `;
      slot.appendChild(wrap);

      // Helper: normalize English text (lowercase, strip punctuation)
      function normEn(s){
        return (s||'').toLowerCase().replace(/['']/g,"'").replace(/[.,!?;:"()\-—]/g,' ').replace(/\s+/g,' ').trim();
      }
      // Check open question: returns {ok, score, hits, total, hasText, wordCount}
      function checkOpen(oq, text){
        const norm = normEn(text);
        const wordCount = norm ? norm.split(' ').filter(Boolean).length : 0;
        const hasText = wordCount >= 3;
        const groups = oq.keywords || [];
        let hits = 0;
        groups.forEach(group=>{
          if(group.some(kw => norm.includes(normEn(kw)))) hits++;
        });
        const need = oq.minMatches || 1;
        const ok = hasText && hits >= need;
        return {ok, hits, total:groups.length, need, hasText, wordCount};
      }

      let hasChecked = false;
      function runCheck(){
        const fb = wrap.querySelector('.fb');
        const qBlocks = wrap.querySelectorAll('.unseen-q');
        let mcCorrect = 0; const mcTotal = qBlocks.length; let mcAnswered = 0;
        const mcWrong = [];
        qBlocks.forEach(qb=>{
          const correctIdx = parseInt(qb.dataset.correct, 10);
          const qi = parseInt(qb.dataset.qi, 10);
          const opts = qb.querySelectorAll('.q-option');
          const checked = qb.querySelector('input[type="radio"]:checked');
          opts.forEach(o => o.classList.remove('correct','wrong'));

            if(sel === correctIdx){

              opts[sel].classList.add('correct');
            } else {
              opts[sel].classList.add('wrong');
              opts[correctIdx].classList.add('correct');
              mcWrong.push(qi+1);

          } else {
            mcWrong.push(qi+1);

        // Open questions
        const openBlocks = wrap.querySelectorAll('.unseen-open');
        let openOk = 0; const openTotal = openBlocks.length; let openAnswered = 0;
        const openIssues = [];
        openBlocks.forEach(ob=>{
          const oi = parseInt(ob.dataset.oi, 10);
          const oq = passage.openQs[oi];
          const ta = ob.querySelector('.open-input');
          const hint = ob.querySelector('.open-hint');
          ob.classList.remove('open-ok','open-bad','open-partial');
          const r = checkOpen(oq, ta.value);
          if(r.hasText) openAnswered++;
          if(r.ok){
            openOk++;
            ob.classList.add('open-ok');
            hint.innerHTML = `<span class="ok-tag">✓ תשובה טובה</span> זיהינו את הרעיון המרכזי בתשובה שלך.`;
          } else if(!r.hasText){
            ob.classList.add('open-bad');
            hint.innerHTML = `<span class="bad-tag">חסרה תשובה</span> כתוב/כתבי משפט שלם באנגלית.`;
            openIssues.push(oi+1);
          } else {
            ob.classList.add('open-partial');
            hint.innerHTML = `<span class="partial-tag">כמעט שם</span> זיהינו <strong>${r.hits}</strong> מהרעיונות הדרושים, צריך לפחות <strong>${r.need}</strong>. נסה/י להוסיף פרטים מהקטע.`;
            openIssues.push(oi+1);
          }
        });
        // Combined feedback
        const total = mcTotal + openTotal;
        const correct = mcCorrect + openOk;
        const answered = mcAnswered + openAnswered;
        if(correct === total){
          fb.className = 'feedback show ok';
          fb.textContent = `🎉 כל הכבוד! ענית נכון על כל ${total} השאלות (${mcCorrect}/${mcTotal} אמריקאיות + ${openOk}/${openTotal} פתוחות).`;
        } else if(answered === 0){
          fb.className = 'feedback show bad';
          fb.textContent = '🤔 עדיין לא ענית על שאלות. בחר/י תשובות וכתב/י תשובות פתוחות.';
        } else if(correct === 0){
          fb.className = 'feedback show bad';
          fb.textContent = `✗ אף תשובה לא נכונה עדיין. חזרו לקטע ונסו שוב.`;
        } else {
          fb.className = 'feedback show partial';
          const parts = [];
          if(mcWrong.length) parts.push(`אמריקאיות: ${mcWrong.join(', ')}`);
          if(openIssues.length) parts.push(`פתוחות: ${openIssues.join(', ')}`);
          fb.innerHTML = `✓ <strong>${correct} מתוך ${total}</strong> נכון. נשאר לתקן — ${parts.join(' · ')}.`;
        }
      }
      wrap.querySelector('.ck').onclick = ()=>{ hasChecked = true; runCheck(); };
      // Live re-check on selection change after first check
      wrap.querySelectorAll('input[type="radio"]').forEach(r=>{
        r.addEventListener('change', ()=>{ if(hasChecked) runCheck(); });
      });
      wrap.querySelectorAll('.open-input').forEach(ta=>{
        ta.addEventListener('input', ()=>{ if(hasChecked) runCheck(); });
      });
      wrap.querySelector('.sol').onclick = ()=>{
        const sl = wrap.querySelector('.sl');
        const mcSol = passage.questions.map((qObj, qi)=>{
          const letter = String.fromCharCode(97 + qObj.correct);
          return `<div class="step"><strong>${qi+1}.</strong> תשובה נכונה: <strong>${letter}</strong> — ${qObj.opts[qObj.correct]}</div>`;
        }).join('');
        const openSol = (passage.openQs || []).map((oq, oi)=>{
          return `<div class="step"><strong>${oi+1}.</strong> תשובה לדוגמה: <em>"${oq.sample}"</em></div>`;
        }).join('');
        sl.innerHTML = `
          <h4>פתרונות — שאלות אמריקאיות</h4>${mcSol}
          ${openSol ? `<h4 style="margin-top:14px">פתרונות — שאלות פתוחות</h4>${openSol}` : ''}
        `;
        sl.classList.add('show');
        // Mark correct answers
        wrap.querySelectorAll('.unseen-q').forEach(qb=>{
          const correctIdx = parseInt(qb.dataset.correct, 10);
          const opts = qb.querySelectorAll('.q-option');
          opts.forEach(o => o.classList.remove('correct','wrong'));
          opts[correctIdx].classList.add('correct');
        });
      };
      wrap.querySelector('.nx').onclick = ()=> gen();
      refmath();
    }
    gen();
  }
};

/* ===== Init ===== */
let savedMode = null;
let savedSubject = null;
try { savedMode = localStorage.getItem('learnMathDevice'); } catch(e){}
try { savedSubject = localStorage.getItem('learnMathSubject'); } catch(e){}

if(savedSubject === 'math' || savedSubject === 'english'){
  window._learnSubject = savedSubject;
} else {
  window._learnSubject = 'math';
}

if(savedMode === 'mobile' || savedMode === 'desktop'){
  applyDeviceMode(savedMode);
  if(!savedSubject){
    showSubjectPicker(true);
    renderHome();
  } else {
    renderHome();
  }
} else {
  document.body.classList.add('mode-desktop');
  showDevicePicker(true);
  renderHome();
}
</script>

</html>
